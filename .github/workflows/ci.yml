name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # rust-toolchain.toml pins the compiler §25.8 records; rustup honours it,
      # so the boundary CI builds is the one the floor names.
      - name: Build the POSIX boundary from source
        run: bun run build:native
      - name: Check the boundary reaches no further than it claims
        run: |
          export LC_ALL=C
          undefined=$(nm -D -u native/atlas-posix/target/release/libatlas_posix.so | awk '{print $2}' | grep -vE '^(__cxa_finalize|__gmon_start__|_ITM_(de)?registerTMCloneTable|memcpy|memset)$' | sort)
          expected=$(printf '%s\n' __errno_location close closedir fdopendir mkdirat openat readdir renameat statx unlinkat | sort)
          if [ "$undefined" != "$expected" ]; then
            echo "the boundary's calls changed; §25.8 says this list is its whole reach" >&2
            diff <(echo "$expected") <(echo "$undefined") >&2 || true
            exit 1
          fi
      - name: Typecheck the viewer and script sources
        run: bun run typecheck
      - name: Check the committed viewer build matches its source
        run: bun run build:check
      - name: Unit-test the ported modules
        run: bun run test
      - name: Compare the ported modules against the Python oracle
        run: bun run differential
      - run: bun scripts/check_public_hygiene.ts
      - run: bun scripts/check_sdd_conventions.ts check AGENTS.md --template conventions/SDD-CONVENTIONS.md
      - run: bun scripts/check_decision_log.ts --baseline 2026-08-11 DECISION-LOG.md
      - name: Check schema and implementation constants
        run: bun scripts/validate_atlas.ts check-constants
      - name: Validate public golden fixtures
        env:
          PYTHONPATH: scripts
        run: |
          bun scripts/validate_atlas.ts conformance
          bun scripts/validate_atlas.ts validate fixtures/demo-instance
          python -m unittest -v scripts.test_demo_graph_fixture
      - name: Verify deterministic fixture builds
        env:
          PYTHONPATH: scripts
        run: >-
          python -m unittest -v
          scripts.test_build_atlas_graph.BuilderIntegrationTests.test_graph_envelope_is_first_and_build_is_deterministic
          scripts.test_build_atlas_graph.LaneBTests.test_explicit_as_of_flag_stamps_generated_at
          scripts.test_build_atlas_graph.LaneBTests.test_two_emitted_graphs_are_byte_identical
      - run: python -m unittest discover -s scripts -p "test_*.py"

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.54.0 && playwright install --with-deps chromium
      - run: ATLAS_VIEWER_ACCEPTANCE=1 python -m unittest discover -s scripts -p "test_viewer*.py" -v
