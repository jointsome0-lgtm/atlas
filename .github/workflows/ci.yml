name: Build and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            maturin: maturin[zig]==1.15.0
            flags: --zig --compatibility manylinux_2_28
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin: maturin[zig]==1.15.0
            flags: --zig --compatibility manylinux_2_28
          - runner: macos-15
            target: aarch64-apple-darwin
            maturin: maturin==1.15.0
            flags: --compatibility pypi
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            maturin: maturin==1.15.0
            flags: --compatibility pypi
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            maturin: maturin==1.15.0
            flags: --compatibility pypi
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.7"
          enable-cache: false
      - run: python scripts/check_distribution.py version
      - if: github.ref_type == 'tag'
        run: python scripts/check_distribution.py release "$GITHUB_REF_NAME"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python scripts/limits.py
      - run: python -m pip install '${{ matrix.maturin }}'
      - run: maturin build --release --locked --target ${{ matrix.target }} ${{ matrix.flags }} --out target/wheels
      - run: python scripts/check_distribution.py artifacts target/wheels
      - run: python scripts/check_distribution.py wheel target/wheels/*.whl
      - if: matrix.runner == 'ubuntu-24.04'
        run: |
          maturin sdist --out target/wheels
          python scripts/check_distribution.py artifacts target/wheels
          python scripts/check_distribution.py source target/wheels/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distributions-${{ matrix.target }}
          path: target/wheels/*
          if-no-files-found: error
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
  github-release:
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - name: Attach the tested packages and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
