[package]
name = "atlas"
version = "0.1.0"
edition = "2024"
description = "A local record of interactions with materials"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jointsome0-lgtm/atlas"
include = ["/Cargo.toml", "/Cargo.lock", "/pyproject.toml", "/README.md", "/LICENSE", "/src/**"]
default-run = "atlas"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proc-macro2 = "1"
rustc_lexer = "0.1"
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
